events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Gzip compression for faster loading on AWS
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    upstream ui_backend {
        server ui-service:9090;
    }

    upstream gateway_backend {
        server api-gateway:8080;
    }

    upstream eureka_backend {
        server service-registry:8761;
    }

    server {
        listen 80;
        server_name localhost _;

        # Client Max Body Size for image uploads
        client_max_body_size 25M;

        # Frontend UI Route (Default)
        location / {
            proxy_pass http://ui_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Eureka Dashboard Route
        location /eureka {
            proxy_pass http://eureka_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API Gateway Route
        location /api/ {
            proxy_pass http://gateway_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Healthcheck endpoint for AWS ALB (Application Load Balancer)
        location /healthz {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
