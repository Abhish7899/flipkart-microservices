apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-gateway-and-ui
  namespace: flipkart-prod
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: ["ui-service", "api-gateway"] }
  ingress:
    - from:
        - namespaceSelector: {} # Allow from Ingress controller namespace
      ports:
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 8080
  policyTypes:
    - Ingress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-services-isolation
  namespace: flipkart-prod
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: ["user-service", "product-service", "order-service", "notification-service"] }
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
        - podSelector:
            matchLabels:
              app: service-registry
        - podSelector:
            matchLabels:
              app: prometheus
  policyTypes:
    - Ingress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-isolation
  namespace: flipkart-prod
spec:
  podSelector:
    matchLabels:
      app: postgres
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: ["user-service", "product-service", "order-service"] }
      ports:
        - protocol: TCP
          port: 5432
  policyTypes:
    - Ingress
