apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: flipkart-prod
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432

---
apiVersion: v1
kind: Service
metadata:
  name: service-registry
  namespace: flipkart-prod
spec:
  type: ClusterIP
  selector:
    app: service-registry
  ports:
    - port: 8761
      targetPort: 8761

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: flipkart-prod
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: ui-service
  namespace: flipkart-prod
spec:
  type: ClusterIP
  selector:
    app: ui-service
  ports:
    - port: 9090
      targetPort: 9090

---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: flipkart-prod
spec:
  type: ClusterIP
  selector:
    app: product-service
  ports:
    - port: 8082
      targetPort: 8082

---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: flipkart-prod
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
    - port: 8081
      targetPort: 8081
