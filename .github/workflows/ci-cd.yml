name: Flipkart Microservices CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/flipkart

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: BUILD AND TEST
  # ─────────────────────────────────────────────────────────────
  build-and-test:
    name: 🔨 Build & Maven Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests=true

      - name: Run Unit Tests
        run: mvn test -Dtest=*Test

  # ─────────────────────────────────────────────────────────────
  # JOB 2: SECURITY & VULNERABILITY SCAN
  # ─────────────────────────────────────────────────────────────
  security-scan:
    name: 🛡️ Security & Vulnerability Scan
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy FS Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # Non-blocking for learning pipeline

  # ─────────────────────────────────────────────────────────────
  # JOB 3: DOCKER BUILD & PUSH (GHCR / ECR)
  # ─────────────────────────────────────────────────────────────
  docker-build-push:
    name: 🐳 Docker Build & Publish
    needs: security-scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: service-registry
            context: service-registry
            image: service-registry
          - name: api-gateway
            context: api-gateway
            image: api-gateway
          - name: user-service
            context: user-service
            image: user-service
          - name: product-service
            context: product-service
            image: product-service
          - name: ui-service
            context: ui-service
            image: ui-service
          - name: order-service
            context: order-service
            image: order-service
          - name: notification-service
            context: notification-service
            image: notification-service
          - name: nginx
            context: docker/nginx
            image: nginx-proxy

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.image }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  # JOB 4: DEPLOY TO KUBERNETES
  # ─────────────────────────────────────────────────────────────
  deploy-to-k8s:
    name: 🚀 Deploy to Kubernetes Cluster
    needs: docker-build-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Set Kubeconfig (if secret is configured)
        if: "${{ secrets.KUBECONFIG != '' }}"
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Deploy Kubernetes Manifests
        if: "${{ secrets.KUBECONFIG != '' }}"
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/secrets.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/services/
          kubectl apply -f k8s/deployments/
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/monitoring/
          kubectl rollout status deployment/ui-service -n flipkart-prod --timeout=120s
          kubectl rollout status deployment/api-gateway -n flipkart-prod --timeout=120s

      - name: Deployment Instructions Reminder
        if: "${{ secrets.KUBECONFIG == '' }}"
        run: |
          echo "💡 Note: To enable automated deployment to your AWS EKS / K8s cluster:"
          echo "1. Export your cluster kubeconfig: cat ~/.kube/config | base64 -w 0"
          echo "2. Add it as a GitHub Secret named 'KUBECONFIG' under Settings > Secrets > Actions."
